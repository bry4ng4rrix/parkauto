name: parkauto
description: "ParkAuto — application mobile des conducteurs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  file_picker: ^12.3.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  # 11.x exige compileSdk 37, non supporté par l'AGP du projet.
  flutter_secure_storage: ">=10.3.3 <11.0.0"
  go_router: ^17.5.0
  image_picker: ^1.2.3
  # Version épinglée par flutter_localizations.
  intl: ^0.20.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
